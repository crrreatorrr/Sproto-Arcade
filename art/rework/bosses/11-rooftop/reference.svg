<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#102432"/><g font-family="system-ui,sans-serif"><text x="40" y="44" font-size="16" fill="#91ead5">SPROTO ARCADE / MACHINE LOOK DEVELOPMENT</text><text x="40" y="84" font-size="34" fill="#e4e9e8">Goldie · two-phase silhouette reference</text><text x="40" y="116" font-size="15" fill="#efc789">PROCEDURAL PLACEHOLDER · NOT APPROVED FOR PRODUCTION</text><rect x="40" y="145" width="580" height="410" rx="12" fill="#1b3443"/><text x="62" y="180" font-size="22" fill="#e4e9e8">PHASE 1 / Pursuit Jetpack</text><g transform="translate(72,190) scale(.95)"><rect x="188" y="135" width="124" height="105" rx="20" fill="#6e5542" stroke="#f0c77e" stroke-width="5"/><g><rect x="219" y="81" width="62" height="82" rx="18" fill="#dab679"/><circle cx="238" cy="108" r="4" fill="#102432"/><circle cx="262" cy="108" r="4" fill="#102432"/><text x="205" y="63" font-size="14" fill="#ffe1a2">GOLDIE</text></g><path d="M182 220v66 M318 220v66" stroke="#b9ced1" stroke-width="24"/><path d="M182 289v32 M318 289v32" stroke="#eea371" stroke-width="15"/><g stroke="#f2a8db" fill="none"><circle cx="250" cy="220" r="10"/><path d="M233 220h34 M250 203v34"/></g><text x="271" y="225" font-size="13" fill="#f2a8db">pack pivot</text><g stroke="#f2a8db" fill="none"><circle cx="322" cy="181" r="10"/><path d="M305 181h34 M322 164v34"/></g><text x="343" y="186" font-size="13" fill="#f2a8db">aim muzzle</text><text x="45" y="345" font-size="15" fill="#e4e9e8">pilot tilts nozzle / aims arm →</text></g><text x="60" y="590" font-size="20" fill="#efc789">Cue → release → recovery</text><text x="60" y="620" font-size="17" fill="#e4e9e8">48t windup</text><text x="60" y="647" font-size="17" fill="#e4e9e8">130t active</text><text x="60" y="674" font-size="17" fill="#e4e9e8">10t recovery</text><rect x="660" y="145" width="580" height="410" rx="12" fill="#1b3443"/><text x="682" y="180" font-size="22" fill="#