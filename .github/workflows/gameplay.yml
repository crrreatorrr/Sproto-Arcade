name: Gameplay checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deterministic-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run standard-kit, pacing and lifecycle checks
        run: node qa/run-all.mjs .
